<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles/mobile.styles.css" />
    <title>Frontend Mentor | Weather app</title>
  </head>
  <body>
    <!--Testing grid layout-->
    <main class="weather__container">
      <header class="weather__headerbar">
        <!--Header bar with logo and unit selection dropdown-->
        <div class="weather__logo">
          <img src="./assets/images/logo.svg" alt="weather now logo" />
        </div>

        <div class="weather__units">
          <!--Hidden label for accessibility-->
          <label for="myWeatherDropdown" class="visually-hidden"
            >Select units</label
          >
          <select id="myWeatherDropdown" name="weatherDropdown">
            <!--Using a disabled selected option value below to make a settings gear
        and Units appear like a label but not able to be selected-->
            <option value="" disabled selected>&#x2699; Units</option>
            <option value="imperial">Imperial</option>
            <option value="metric">Metric</option>
          </select>
        </div>
      </header>

      <section class="weather__lookup">
        <div class="weather__title">
          <h1 class="weather__heading">How's the sky looking today?</h1>
        </div>

        <form class="weather__form" id="weatherForm">
          <div class="weather__input">
            <span class="input__prefix"
              ><img
                src="./assets/images/icon-search.svg"
                alt=""
                aria-hidden="true"
            /></span>
            <input
              type="text"
              class="weather__input-control"
              id="search"
              name="search"
              placeholder="Search for a place..."
              minlength="1"
              maxlength="30"
              required
            />
            <p class="input__error"></p>
          </div>

          <div class="weather__submit">
            <label for="search" class="visually-hidden"
              >Search for a place</label
            >
            <button
              type="submit"
              class="weather__submitbutton"
              id="weatherButton"
            >
              Search
            </button>
          </div>
        </form>
      </section>
      <!--Including aria below so screen readers announce new weather data when it populates-->
      <section class="weather__resultscontainer" aria-live="polite">
        <div id="weather__results">
          <h2 class="weather__results-title" id="resultsCity">
            <!--Populate City Name-->
          </h2>
          <p class="weather__results-date" id="resultsDate">
            99<!--Populate current date-->
          </p>

          <!--Populate weather icon-->
          <img src="" id="resultsIcon" alt="" />

          <p class="weather__results-temp" id="resultsTemp">
            <!--Populate large font temp-->
          </p>
        </section>

        <section class="weather__specificscontainer">
          <div class="weather__feelslike">
            <p class="weather__feelslike-label">Feels Like</p>
            <p class="weather__results-value" id="feelslikeValue">
              <!--JS here-->
            </p>
          </div>
          <div class="weather__humidity">
            <p class="weather__humidity-label">Humidity</p>
            <p class="weather__results-value" id="humidityValue"></p>
          </div>
          <div class="weather__wind">
            <p class="weather__results-value" id="humidityValue">Wind</p>
          </div>
          <div class="weather__precipitation">
            <p class="weather__results-value" id="precipitationValue">
              Precipitation
            </p>
          </div>
        </div>
      </section>

      <section class="weather__dailycontainer" aria-label="daily forecast">
        <h2 class="weather__dailyforecast-heading">Daily Forecast</h2>

        <!--Empty container for dynamically generated days-->
        <div id="weather__dayscontainer"></div>

        <!--Trying template class for dynamic population-->
        <template id="weather__day-template">
          <article class="weather__day">
            <p class="weather__day-name"></p>
            <img class="weather__day-icon" src="" alt="Weather icon" />
            <p class="weather__day-temp-high"></p>
            <p class="weather__day-temp-low"></p>
          </article>
        </template>
      </section>

      <section class="weather__hourlycontainer" aria-label="hourly forecast">
        <h2 class="weather__hourlyforecast-heading">Hourly forecast</h2>

        <div class="weather__hourlyforecast-dropdown">
          <select id="myWeatherDropdownDay" name="weatherDropdownDay">
            <option value="monday">Monday</option>
            <option value="tuesday">Tuesday</option>
            <option value="wednesday">Wednesday</option>
            <option value="thursday">Thursday</option>
            <option value="friday">Friday</option>
            <option value="saturday">Saturday</option>
            <option value="sunday">Sunday</option>
          </select>
        </div>

        <div id="weather__hourscontainer"></div>

        <template id="weather__hour-template">
          <article class="weather__hour">
            <p class="weather__hour-time"></p>
            <img class="weather__hour-icon" src="" alt="" />
            <p class="weather__hour-temp"></p>
          </article>
        </template>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">M G</a>.
    </footer>

    <script src="./scripts/main.js"></script>
  </body>
</html>
